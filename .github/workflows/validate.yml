name: Validate marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate the marketplace with Claude Code
        run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate . --strict
      - name: Check whitespace
        run: git show --format= --check HEAD
